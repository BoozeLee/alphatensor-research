name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt 2>/dev/null || true
      - run: pip install ruff pytest
      - run: ruff check . 2>&1 | head -30 || true
      - run: python -m pytest 2>&1 | tail -20 || true

